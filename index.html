<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Lista de Regalos - Riu 2026 🎂</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; overflow-x: hidden; }
    .purchased-card { filter: grayscale(35%); background-color: #f8fafc; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

  <header class="bg-white border-b border-slate-100 py-10 px-4 text-center shadow-sm">
    <div class="max-w-3xl mx-auto">
      <span class="text-4xl animate-bounce inline-block">🎂</span>
      <h1 class="text-3xl font-bold text-slate-900 mt-2 tracking-tight">Mi Lista de Regalos - Riu 2026</h1>
      <p class="text-slate-500 mt-3 text-sm max-w-xl mx-auto">
        ¡Hola! Si deseas hacerme un detalle, aquí tienes la lista oficial. Marca el que elijas para que nadie más lo repita. ¡Gracias!
      </p>
    </div>
  </header>

  <section class="max-w-7xl mx-auto px-4 mt-8 w-full">
    <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex flex-col sm:flex-row gap-4 items-center justify-between">
      
      <div class="w-full sm:w-auto flex items-center gap-2">
        <label for="filter-category" class="text-xs font-semibold text-slate-500 uppercase tracking-wider whitespace-nowrap">Categoría:</label>
        <select id="filter-category" onchange="applyFiltersAndSort()" class="w-full sm:w-56 bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-xl p-2 px-3 focus:outline-none focus:border-indigo-500 transition-colors cursor-pointer">
          <option value="all">Todas las categorías</option>
        </select>
      </div>

      <div class="w-full sm:w-auto flex items-center gap-2">
        <label for="sort-by" class="text-xs font-semibold text-slate-500 uppercase tracking-wider whitespace-nowrap">Ordenar por:</label>
        <select id="sort-by" onchange="applyFiltersAndSort()" class="w-full sm:w-60 bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-xl p-2 px-3 focus:outline-none focus:border-indigo-500 transition-colors cursor-pointer">
          <option value="default">Posición original</option>
          <option value="priority-desc">Prioridad: Más deseados primero</option>
          <option value="price-asc">Precio: Menor a Mayor</option>
          <option value="price-desc">Precio: Mayor a Menor</option>
          <option value="available-first">Disponibilidad (Disponibles primero)</option>
        </select>
      </div>

    </div>
  </section>

  <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
    
    <div id="loading" class="flex flex-col items-center justify-center py-20">
      <div class="animate-spin rounded-full h-12 w-12 border-b-4 border-indigo-600"></div>
      <p class="text-slate-500 mt-4 font-medium animate-pulse">Consultando catálogo en la nube...</p>
    </div>

    <div id="empty-state" class="hidden text-center py-16 bg-white rounded-2xl border border-dashed border-slate-300 max-w-md mx-auto shadow-sm px-4">
      <span class="text-4xl">🎁</span>
      <p class="text-slate-600 font-semibold mt-3">No se encontraron regalos con este filtro</p>
    </div>

    <div id="gifts-container" class="hidden grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8"></div>
  </main>

  <footer class="text-center py-6 text-xs text-slate-400 border-t border-slate-200 bg-white mt-12 w-full">
    mrazurisa &copy; 2026
  </footer>

  <script>
    // --- CONFIGURACIÓN CRÍTICA ---
    // Mantenemos tu URL original intacta
    const API_URL = "https://script.google.com/macros/s/AKfycbzeUEJr7O_gz6sfxWQRAyoMRfmfDIaMqEWSKyUP8YRLtW3RDkYf3hV88FOBmElmZSRr9Q/exec";

    let allGifts = []; // Memoria caché para evitar peticiones repetidas al servidor

    document.addEventListener("DOMContentLoaded", function() {
      fetchGiftsFromBackend();
    });

    // Petición HTTP nativa hacia la API de Google Apps Script
    function fetchGiftsFromBackend() {
      document.getElementById("loading").classList.remove("hidden");
      document.getElementById("gifts-container").classList.add("hidden");
      document.getElementById("empty-state").classList.add("hidden");

      fetch(`${API_URL}?action=getGifts`)
        .then(response => response.json())
        .then(response => {
          document.getElementById("loading").classList.add("hidden");
          if (!response.success) {
            Swal.fire("Error de API", response.error, "error");
            return;
          }
          allGifts = response.data;
          buildCategoryFilter(); // Generar filtros dinámicos
          applyFiltersAndSort(); // Renderizar tarjetas ordenadas
        })
        .catch(handleServerError);
    }

    // Extrae y construye las opciones del selector según lo que tengas en Sheets
    function buildCategoryFilter() {
      const categorySelect = document.getElementById("filter-category");
      categorySelect.innerHTML = '<option value="all">Todas las categorías</option>';
      
      // Obtener lista limpia de categorías únicas sin repetir
      const uniqueCategories = [...new Set(allGifts.map(g => g.categoria).filter(c => c && c.trim() !== ""))];
      
      uniqueCategories.forEach(cat => {
        const option = document.createElement("option");
        option.value = cat;
        option.textContent = cat;
        categorySelect.appendChild(option);
      });
    }

    // Lógica encargada de interceptar los filtros sin refrescar la página
    function applyFiltersAndSort() {
      const selectedCategory = document.getElementById("filter-category").value;
      const selectedSort = document.getElementById("sort-by").value;
      
      let processedGifts = [...allGifts];

      // 1. Filtrar por Categoría
      if (selectedCategory !== "all") {
        processedGifts = processedGifts.filter(g => g.categoria === selectedCategory);
      }

      // 2. Ejecutar Métodos de Ordenamiento
      if (selectedSort === "price-asc") {
        processedGifts.sort((a, b) => a.precio - b.precio);
      } 
      else if (selectedSort === "price-desc") {
        processedGifts.sort((a, b) => b.precio - a.precio);
      } 
      else if (selectedSort === "priority-desc") {
        const weights = { "Alta": 3, "Media": 2, "Baja": 1 };
        processedGifts.sort((a, b) => (weights[b.prioridad] || 0) - (weights[a.prioridad] || 0));
      } 
      else if (selectedSort === "available-first") {
        processedGifts.sort((a, b) => (a.estado === "Disponible" ? -1 : 1));
      }

      // 3. Renderizar resultados procesados
      renderGiftsGrid(processedGifts);
    }

    // Dibuja las tarjetas en el DOM
    function renderGiftsGrid(gifts) {
      const container = document.getElementById("gifts-container");
      container.innerHTML = "";

      if (gifts.length === 0) {
        document.getElementById("gifts-container").classList.add("hidden");
        document.getElementById("empty-state").classList.remove("hidden");
        return;
      }

      document.getElementById("empty-state").classList.add("hidden");
      document.getElementById("gifts-container").classList.remove("hidden");

      gifts.forEach(gift => {
        const isAvailable = gift.estado === "Disponible";
        
        // Estilos inteligentes visuales para los niveles de prioridad
        let priorityStyle = "bg-slate-100 text-slate-600 border-slate-200"; // Color gris por defecto
const prioridadLimpia = gift.prioridad ? gift.prioridad.toLowerCase().trim() : "";

if (prioridadLimpia === "alta") {
  priorityStyle = "bg-rose-50 text-rose-700 border-rose-200 font-semibold"; // Rojo/Rosa suave
} else if (prioridadLimpia === "media") {
  priorityStyle = "bg-amber-50 text-amber-700 border-amber-200 font-medium"; // Naranja/Ámbar cálido
} else if (prioridadLimpia === "baja") {
  priorityStyle = "bg-emerald-50 text-emerald-700 border-emerald-200 font-medium"; // Verde esmeralda suave
}
        
        const cardHtml = `
          <div class="bg-white rounded-2xl shadow-md overflow-hidden border border-slate-100 flex flex-col justify-between transition-all duration-300 hover:shadow-xl ${!isAvailable ? 'purchased-card shadow-none' : ''}">
            <div>
              <div class="relative bg-white h-44 sm:h-48 w-full flex items-center justify-center overflow-hidden border-b border-slate-100 p-3">
                <img src="${gift.imagen}" alt="${gift.titulo}" class="object-contain w-full h-full" onerror="this.src='https://images.unsplash.com/photo-1549465220-1a8b9238cd48?q=80&w=500'">
                ${!isAvailable ? '<div class="absolute inset-0 bg-slate-900/40 backdrop-blur-[1px] flex items-center justify-center"><span class="text-white font-bold tracking-wider text-xs uppercase bg-slate-900/60 py-1.5 px-3 rounded-full shadow-sm">Ya comprado ❤️</span></div>' : ''}
              </div>
              
              <div class="p-5 pb-3">
                <div class="flex gap-1.5 items-center mb-2.5 flex-wrap">
                  <span class="text-[9px] uppercase tracking-wider bg-slate-100 text-slate-500 border border-slate-200 px-2 py-0.5 rounded-md font-medium">${gift.categoria || 'Otros'}</span>
                  <span class="text-[9px] uppercase tracking-wider border px-2 py-0.5 rounded-md ${priorityStyle}">Deseo: ${gift.prioridad || 'Media'}</span>
                </div>

                <h3 class="font-medium text-slate-800 text-xs sm:text-sm line-clamp-2 min-h-[2.5rem] mb-1">${gift.titulo}</h3>
                
                ${gift.precio && gift.precio !== 0 && gift.precio !== "No detectado" ? `
                  <div class="mt-2 flex items-center gap-1 text-emerald-600 font-semibold text-sm">
                    <span class="text-[9px] text-slate-400 font-bold uppercase tracking-wider">Precio ref:</span>
                    <span class="text-emerald-600 font-bold text-sm sm:text-base">S/. ${parseFloat(gift.precio).toFixed(2)}</span>
                  </div>
                ` : `
                  <div class="mt-2 flex items-center gap-1 text-slate-400 font-semibold text-xs">
                    <span class="text-[9px] text-slate-400 font-bold uppercase tracking-wider">Precio ref:</span>
                    <span class="font-normal italic">Consultar tienda</span>
                  </div>
                `}

                ${gift.detalles ? `
                  <div class="mt-3 bg-indigo-50/70 border border-indigo-100 rounded-xl p-2.5 text-xs text-indigo-950 flex flex-col gap-0.5">
                    <span class="font-bold text-[9px] text-indigo-500 uppercase">Especificación:</span>
                    <span class="text-slate-700">${gift.detalles}</span>
                  </div>
                ` : ''}
              </div>
            </div>
            
            <div class="p-5 pt-2 mt-auto">
              <a href="${gift.enlace}" target="_blank" class="block w-full text-center bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2 px-4 rounded-xl text-sm mb-2 transition-colors">Ver Tienda 🔗</a>
              ${isAvailable ? `
                <button onclick="buttonConfirmPurchase('${gift.id}', '${gift.titulo}')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-xl text-sm shadow-sm transition-all">Marcar como comprado 🎁</button>
              ` : `
                <button disabled class="w-full bg-slate-200 text-slate-400 font-medium py-2 px-4 rounded-xl text-sm cursor-not-allowed">Reservado</button>
              `}
            </div>
          </div>
        `;
        container.insertAdjacentHTML('beforeend', cardHtml);
      });
    }

    // Renombrado para evitar colisiones
    function buttonConfirmPurchase(id, name) {
      Swal.fire({
        title: '¿Confirmas la compra?',
        text: `Vas a marcar "${name}" como comprado.`,
        icon: 'question',
        showCancelButton: true,
        confirmButtonColor: '#4f46e5',
        cancelButtonText: 'Cancelar'
      }).then((result) => {
        if (result.isConfirmed) {
          Swal.showLoading();
          
          fetch(`${API_URL}?action=buyGift&id=${id}`)
            .then(res => res.json())
            .then(res => {
              if (res.success) {
                Swal.fire('¡Muchas Gracias!', res.message, 'success');
              } else {
                Swal.fire('Aviso', res.message, 'warning');
              }
              fetchGiftsFromBackend(); // Recarga reactiva local
            })
            .catch(handleServerError);
        }
      });
    }

    function handleServerError() {
      document.getElementById("loading").classList.add("hidden");
      Swal.fire("Error de Conexión", "No se pudo comunicar con el servidor API de Google.", "error");
    }
  </script>
</body>
</html>
